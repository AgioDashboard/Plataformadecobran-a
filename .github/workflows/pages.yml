name: Publicar painel no GitHub Pages

# Substitui a publicacao automatica do GitHub, que passava pelo Jekyll.
# Aqui nada e processado: os arquivos sobem como estao.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nao cancela uma publicacao em andamento: derrubar um deploy no meio
# pode deixar o site num estado parcial.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      # Lista explicita, nao glob. Um arquivo novo so vai para o ar se
      # alguem o acrescentar aqui de proposito — backend/, docs/ e config/
      # nunca sobem por descuido.
      - name: Montar o site
        run: |
          mkdir -p site
          cp index.html \
             estilos.css \
             app.js \
             logica.js \
             filtros.js \
             estado-pausa.js \
             nao-perturbe.js \
             detalhe-cliente.js \
             dados-mock.js \
             dados-remotos.js \
             site/
          touch site/.nojekyll
          echo "Arquivos que vao para o ar:"
          ls -la site/

      # O repositorio e publico e o site tambem. Se um segredo escapar para
      # um arquivo do painel, a publicacao falha antes de ir para o ar.
      - name: Barrar segredo no que vai ser publicado
        run: |
          if grep -rEn 'EAA[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9]{10,}|xoxb-[A-Za-z0-9-]{10,}' site/; then
            echo "::error::Credencial encontrada nos arquivos do site. Publicacao abortada."
            exit 1
          fi
          echo "Nenhuma credencial encontrada."

      # Telefone real no painel publico seria exposicao de dado pessoal.
      # O mock usa o padrao 55DD9000000NN; qualquer outro derruba o build.
      - name: Barrar telefone fora do padrao ficticio
        run: |
          suspeitos=$(grep -rEoh '55[0-9]{11}' site/ | grep -vE '^55[0-9]{2}9000000[0-9]{2}$' || true)
          if [ -n "$suspeitos" ]; then
            echo "::error::Telefone fora do padrao ficticio encontrado: $suspeitos"
            exit 1
          fi
          echo "Todos os telefones seguem o padrao ficticio."

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
